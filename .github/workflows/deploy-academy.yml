name: Deploy Ludo Academy
on:
  push:
    branches:
      - main
jobs:
  deploy_academy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LUDOLEAGUESA }}
      - name: Deploy Ludo Academy to Firebase Hosting
        run: firebase deploy --only hosting --project ludoleaguesa-33371 --force
