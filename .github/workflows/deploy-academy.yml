name: Deploy Ludo Academy
on:
  push:
    branches:
      - main
    paths:
      - 'ludo-academy/**'
      - 'firebase.json'
jobs:
  deploy_academy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Firebase
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting:YOUR_ACADEMY_SITE_ID
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
