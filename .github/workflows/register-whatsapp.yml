name: Register WhatsApp Webhook

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Main Site to Firebase Hosting & Functions"]
    types: [completed]

jobs:
  register_webhook:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Register app webhook subscription
        id: app_subscription
        run: |
          APP_TOKEN="${{ secrets.META_APP_ID }}|${{ secrets.META_APP_SECRET }}"
          RESP=$(curl -sS -w "\n%{http_code}" -X POST "https://graph.facebook.com/v21.0/${{ secrets.META_APP_ID }}/subscriptions" \
            --data-urlencode "object=whatsapp_business_account" \
            --data-urlencode "callback_url=https://us-central1-ludoleaguesa-33371.cloudfunctions.net/whatsappWebhook" \
            --data-urlencode "verify_token=${{ secrets.WHATSAPP_VERIFY_TOKEN }}" \
            --data-urlencode "fields=messages" \
            --data-urlencode "access_token=${APP_TOKEN}")
          HTTP="${RESP##*$'\n'}"
          BODY="${RESP%$'\n'*}"
          echo "HTTP $HTTP"
          echo "$BODY"
          echo "$BODY" | jq -e '.success == true' > /dev/null || {
            echo "::error::Webhook subscription failed: $BODY"
            exit 1
          }
          echo "App webhook subscription registered."

      - name: Diagnose token & phone number access
        run: |
          echo "== /me (system user) =="
          curl -sS "https://graph.facebook.com/v21.0/me?fields=id,name&access_token=${{ secrets.WHATSAPP_TOKEN }}"
          echo ""
          echo "== WABAs visible to token =="
          curl -sS "https://graph.facebook.com/v21.0/me/businesses?fields=id,name,client_businesses,instagram_business_accounts&access_token=${{ secrets.WHATSAPP_TOKEN }}"
          echo ""
          echo "== Read PHONE_NUMBER_ID directly =="
          curl -sS "https://graph.facebook.com/v21.0/${{ secrets.PHONE_NUMBER_ID }}?fields=display_phone_number,verified_name,id&access_token=${{ secrets.WHATSAPP_TOKEN }}"
          echo ""

      - name: Subscribe phone number
        run: |
          RESP=$(curl -sS -w "\n%{http_code}" -X POST "https://graph.facebook.com/v21.0/${{ secrets.PHONE_NUMBER_ID }}/subscribed_apps" \
            --data-urlencode "access_token=${{ secrets.WHATSAPP_TOKEN }}")
          HTTP="${RESP##*$'\n'}"
          BODY="${RESP%$'\n'*}"
          echo "HTTP $HTTP"
          echo "$BODY"
          if echo "$BODY" | jq -e '.success == true' > /dev/null; then
            echo "Phone number subscribed to the app."
          else
            echo "::warning::Phone number 'subscribed_apps' returned non-success: $BODY"
            echo "Non-fatal: the app-level webhook subscription is already registered. Confirm delivery with a live message test."
          fi
