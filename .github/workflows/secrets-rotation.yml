name: Secrets Rotation Reminder
on:
  schedule:
    - cron: '0 0 1 */3 *' # Runs quarterly

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Reminder Issue
        run: |
          gh issue create \
            --title "[Security] Rotate Secrets and API Keys" \
            --body "It is time for the quarterly secrets rotation. Please review and rotate API keys (e.g., Firebase, DeepSeek) where necessary."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
