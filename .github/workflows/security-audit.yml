name: Security Audit
on: [pull_request, push]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Clean Install Dependencies
        run: |
          rm -rf node_modules
          npm install --legacy-peer-deps

      - name: Verify Plugin Version
        run: npm list @vitejs/plugin-react

      - run: npx tsc --noEmit
      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true
      - name: Check for secrets
        run: |
          if grep -r "FIREBASE_API_KEY\|sk_" src/ --include="*.ts" --include="*.tsx" \
             | grep -v "import.meta.env\|process.env"; then
            exit 1
          fi
      - name: Build Project
        run: npm run build
      - name: Audit Build Artifacts
        run: |
          if grep -r "FIREBASE_API_KEY" dist/ --include="*.js" 2>/dev/null; then
            echo "ERROR: Secrets in build"
            exit 1
          fi
          if find dist -name "*.map" | grep -q .; then
            echo "ERROR: Sourcemaps in dist"
            exit 1
          fi
