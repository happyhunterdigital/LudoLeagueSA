name: Deploy Main Site to Firebase Hosting & Functions
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Frontend Dependencies
        run: npm install --legacy-peer-deps
      - name: Build Frontend Project
        run: npm run build
      - name: Install Functions Dependencies
        run: npm install
        working-directory: ./functions
      - name: Build Functions Project
        run: npm run build
        working-directory: ./functions
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LUDOLEAGUESA }}
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Inject Environment Secrets
        run: |
          echo "DEEPSEEK_API_KEY=${{ secrets.LUDO_DEEPSEEK_API_KEY }}" > functions/.env
          echo "SMTP_HOST=${{ secrets.SMTP_HOST }}" >> functions/.env
          echo "SMTP_PORT=${{ secrets.SMTP_PORT }}" >> functions/.env
          echo "SMTP_USER=${{ secrets.SMTP_USER }}" >> functions/.env
          echo "SMTP_PASS=${{ secrets.SMTP_PASS }}" >> functions/.env
          echo "WHATSAPP_TOKEN=${{ secrets.WHATSAPP_TOKEN }}" >> functions/.env
          echo "PHONE_NUMBER_ID=${{ secrets.PHONE_NUMBER_ID }}" >> functions/.env
          echo "WHATSAPP_VERIFY_TOKEN=${{ secrets.WHATSAPP_VERIFY_TOKEN }}" >> functions/.env
          echo "META_APP_SECRET=${{ secrets.META_APP_SECRET }}" >> functions/.env
          echo "ADMIN_PHONE_NUMBER=${{ secrets.ADMIN_PHONE_NUMBER }}" >> functions/.env
          echo "FIELD_ENCRYPTION_KEY=${{ secrets.FIELD_ENCRYPTION_KEY }}" >> functions/.env
      - name: Deploy to Firebase
        run: firebase deploy --only hosting,functions --project ludoleaguesa-33371 --force
