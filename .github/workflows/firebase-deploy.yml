name: Deploy to Firebase Hosting & Functions
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Frontend Project
        run: npm run build

      - name: Install Functions Dependencies
        run: npm install
        working-directory: ./functions

      - name: Build Functions Project
        run: npm run build
        working-directory: ./functions

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LUDOLEAGUESA }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase
        run: firebase deploy --only hosting,functions --project ludoleaguesa-33371 --force

      - name: Verify Deployment
        run: |
          curl -f https://ludoleague.co.za/index.html || exit 1
          curl -I https://ludoleague.co.za/ | grep "Strict-Transport-Security" || exit 1
