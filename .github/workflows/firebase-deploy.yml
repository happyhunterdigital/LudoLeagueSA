name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Build Vite Project
        run: npm run build

      - name: Direct Firebase CLI Deploy
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LUDOLEAGUESA }}
        run: |
          # 1. Write the raw JSON secret to a secure, temporary file
          echo "$FIREBASE_KEY" > firebase-key.json
          
          # 2. Force the Firebase CLI to use this exact credential
          export GOOGLE_APPLICATION_CREDENTIALS="$(pwd)/firebase-key.json"
          
          # 3. Execute the direct deployment command
          npx firebase-tools deploy --only hosting --project gen-lang-client-0594861537 --force
