<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Academy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial Black', 'Impact', sans-serif;
            background: #0a0a0a;
            color: #fff;
            overflow-x: hidden;
        }

        /* Navigation */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 5%;
            background: rgba(0,0,0,0.9);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: #fff;
            text-decoration: none;
            font-size: clamp(0.8rem, 1.5vw, 1rem);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: #EB1C24;
        }

        /* Main Hero Section */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 8rem 5% 5rem;
            position: relative;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
        }

        /* Ludo Color Bars */
        .ludo-colors {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            opacity: 0.1;
            z-index: 0;
        }

        .color-bar {
            position: absolute;
            width: 200%;
            height: 200%;
            transform: rotate(45deg);
        }

        .color-red { background: #EB1C24; top: -50%; left: -50%; }
        .color-green { background: #02A04B; top: -50%; right: -50%; }
        .color-yellow { background: #FFE013; bottom: -50%; left: -50%; }
        .color-blue { background: #22409A; bottom: -50%; right: -50%; }

        /* Main Heading - Responsive */
        .hero-title {
            font-size: clamp(3rem, 12vw, 10rem);
            font-weight: 900;
            text-align: center;
            line-height: 1;
            margin-bottom: 2rem;
            z-index: 1;
            text-transform: uppercase;
            letter-spacing: -2px;
            background: linear-gradient(135deg, #EB1C24 0%, #02A04B 25%, #FFE013 50%, #22409A 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        /* Tagline - Responsive */
        .hero-tagline {
            font-size: clamp(0.9rem, 2.5vw, 1.5rem);
            text-align: center;
            max-width: 600px;
            margin-bottom: 3rem;
            line-height: 1.6;
            z-index: 1;
            font-family: 'Arial', sans-serif;
            font-weight: 400;
            color: #ccc;
            padding: 0 1rem;
        }

        /* CTA Button */
        .cta-button {
            background: linear-gradient(135deg, #EB1C24 0%, #22409A 100%);
            color: #fff;
            padding: clamp(1rem, 3vw, 1.5rem) clamp(2rem, 5vw, 3rem);
            border: none;
            border-radius: 50px;
            font-size: clamp(1rem, 2.5vw, 1.3rem);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            z-index: 1;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 10px 30px rgba(235, 28, 36, 0.3);
        }

        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(235, 28, 36, 0.5);
        }

        /* Mobile Menu Toggle */
        .menu-toggle {
            display: none;
            flex-direction: column;
            cursor: pointer;
            z-index: 1001;
        }

        .menu-toggle span {
            width: 25px;
            height: 3px;
            background: #fff;
            margin: 3px 0;
            transition: 0.3s;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .nav-links {
                position: fixed;
                top: 0;
                right: -100%;
                width: 70%;
                height: 100vh;
                background: rgba(0,0,0,0.95);
                flex-direction: column;
                justify-content: center;
                align-items: center;
                gap: 3rem;
                transition: 0.3s;
            }

            .nav-links.active {
                right: 0;
            }

            .menu-toggle {
                display: flex;
            }

            .hero {
                padding: 7rem 5% 3rem;
            }

            .hero-title {
                letter-spacing: -1px;
            }
        }

        @media (max-width: 480px) {
            .hero-title {
                font-size: clamp(2.5rem, 15vw, 4rem);
            }

            .hero-tagline {
                font-size: clamp(0.85rem, 4vw, 1.1rem);
            }

            nav {
                padding: 1rem 5%;
            }
        }

        /* Ludo Path Animation */
        .ludo-path {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .path-dot {
            position: absolute;
            width: clamp(8px, 2vw, 15px);
            height: clamp(8px, 2vw, 15px);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; }
        }
    </style>
</head>
<body>
    <nav>
        <div class="menu-toggle" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <ul class="nav-links" id="navLinks">
            <li><a href="#about">About</a></li>
            <li><a href="#training">Training</a></li>
            <li><a href="#success">Success</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <section class="hero">
        <div class="ludo-colors">
            <div class="color-bar color-red"></div>
            <div class="color-bar color-green"></div>
            <div class="color-bar color-yellow"></div>
            <div class="color-bar color-blue"></div>
        </div>
        
        <h1 class="hero-title">LUDO ACADEMY</h1>
        
        <p class="hero-tagline">
            WHERE EVERY MOVE MATTERS. STRATEGY, DISCIPLINE, AND EXCELLENCE.
        </p>
        
        <a href="#join" class="cta-button">JOIN US</a>
    </section>

    <script>
        function toggleMenu() {
            const navLinks = document.getElementById('navLinks');
            navLinks.classList.toggle('active');
        }

        // Add responsive path dots
        function createPathDots() {
            const colors = ['#EB1C24', '#02A04B', '#FFE013', '#22409A'];
            const container = document.querySelector('.hero');
            
            for (let i = 0; i < 20; i++) {
                const dot = document.createElement('div');
                dot.className = 'path-dot';
                dot.style.background = colors[Math.floor(Math.random() * colors.length)];
                dot.style.left = Math.random() * 100 + '%';
                dot.style.top = Math.random() * 100 + '%';
                dot.style.animationDelay = Math.random() * 2 + 's';
                container.appendChild(dot);
            }
        }

        createPathDots();
    </script>
</body>
</html>
