<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Academy of Excellence | Strategic Mindset & Competitive Training</title>
    <meta name="description" content="Ludo Academy of Excellence develops professionals through competitive Ludo training, mentorship, and strategic mindset development.">
    <meta name="keywords" content="Ludo Academy, Strategic Thinking, Ludo Training South Africa, Mindset Development, Ludo League SA">
    <meta property="og:title" content="Ludo Academy of Excellence">
    <meta property="og:description" content="Where strategy meets skill. Developing professionals through competitive Ludo training and community engagement.">
    <meta property="og:type" content="website">
    <link rel="icon" type="image/jpeg" href="https://res.cloudinary.com/dfzeb1s54/image/upload/v1784647932/Ludo_Academy_of_excellence_Logo_ky20i3.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body, #root { background: #0a0e27; font-family: 'Kanit', sans-serif; overflow-x: hidden; }
        .hero-heading { background: linear-gradient(135deg, #d4af37 0%, #f4e5c2 50%, #b8941f 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; filter: drop-shadow(0 2px 8px rgba(212, 175, 55, 0.3)); }
        .nav-text { color: #d4af37; }
        .nav-text:hover { color: #f4e5c2; }
        .contact-gradient { background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 50%, #1e40af 100%); box-shadow: 0px 4px 15px rgba(59, 130, 246, 0.4), inset 0 2px 4px rgba(255,255,255,0.2); border: 2px solid #d4af37; color: #d4af37; }
        .contact-gradient:hover { background: linear-gradient(135deg, #3b82f6 0%, #60a5fa 50%, #3b82f6 100%); transform: scale(1.05); box-shadow: 0px 6px 20px rgba(59, 130, 246, 0.6); }
        .marquee-row, .magnet-wrap { will-change: transform; }
        ::-webkit-scrollbar { width: 8px; } 
        ::-webkit-scrollbar-track { background: #0a0e27; } 
        ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #d4af37, #b8941f); border-radius: 4px; }
        .section-white { background: linear-gradient(180deg, #f8f9fa 0%, #e9ecef 100%); }
        .form-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 1rem; }
        .form-container { background: #0a0e27; border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 1rem; width: 100%; max-width: 32rem; max-height: 90vh; overflow-y: auto; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); }
        .form-header { padding: 1.5rem; border-bottom: 1px solid rgba(212, 175, 55, 0.2); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: #0a0e27; z-index: 10; }
        .form-body { padding: 1.5rem; }
        .form-input { width: 100%; background: #0f1535; border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 0.375rem; padding: 0.5rem 0.75rem; color: white; outline: none; }
        .form-input:focus { border-color: #d4af37; }
        .form-label { display: block; font-size: 0.875rem; color: #d1d5db; margin-bottom: 0.25rem; }
        .form-radio-label, .form-check-label { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; cursor: pointer; color: #e5e7eb; font-size: 0.875rem; }
        .progress-dot { width: 0.75rem; height: 0.75rem; border-radius: 9999px; transition: background-color 0.2s; }
        .cookie-banner { position: fixed; bottom: 1rem; left: 1rem; right: 1rem; z-index: 40; background: #0a0e27; border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 0.75rem; padding: 1rem; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); }
        @media (min-width: 768px) { .cookie-banner { left: auto; right: 1rem; max-width: 24rem; } }
    </style>
    <script type="application/ld+json">
    { "@context": "https://schema.org", "@type": "EducationalOrganization", "name": "Ludo Academy of Excellence", "description": "An academy dedicated to personal development, strategic thinking, and continuous learning through the game of Ludo.", "parentOrganization": { "@type": "Organization", "name": "Ludo League South Africa" }, "areaServed": "ZA", "slogan": "Where strategy meets skill. Learn the game. Master the mindset. Play with excellence." }
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;
        const { motion, useScroll, useTransform, useInView } = window.Motion;
        
        const FadeIn = ({ children, delay = 0, duration = 0.7, x = 0, y = 30, className = "" }) => {
            const ref = useRef(null); 
            const isInView = useInView(ref, { once: true, margin: "50px", amount: 0.1 });
            return <motion.div ref={ref} initial={{ opacity: 0, x, y }} animate={isInView ? { opacity: 1, x: 0, y: 0 } : {}} transition={{ duration, delay, ease: [0.25, 0.1, 0.25, 1] }} className={className}>{children}</motion.div>;
        };
        
        const Magnet = ({ children, padding = 150, strength = 3 }) => {
            const ref = useRef(null); 
            const [transform, setTransform] = useState("translate3d(0px, 0px, 0px)"); 
            const [isActive, setIsActive] = useState(false);
            const handleMouseMove = useCallback((e) => { 
                if (!ref.current) return; 
                const rect = ref.current.getBoundingClientRect(); 
                const distX = e.clientX - (rect.left + rect.width / 2); 
                const distY = e.clientY - (rect.top + rect.height / 2); 
                const distance = Math.sqrt(distX * distX + distY * distY);
                if (distance < Math.max(rect.width, rect.height) / 2 + padding) { 
                    setIsActive(true); 
                    setTransform(`translate3d(${distX / strength}px, ${distY / strength}px, 0px)`); 
                } else { 
                    setIsActive(false); 
                    setTransform("translate3d(0px, 0px, 0px)"); 
                }
            }, [padding, strength]);
            useEffect(() => { 
                window.addEventListener("mousemove", handleMouseMove); 
                return () => window.removeEventListener("mousemove", handleMouseMove); 
            }, [handleMouseMove]);
            return <div ref={ref} className="magnet-wrap inline-block" style={{ transform, transition: isActive ? "transform 0.3s ease-out" : "transform 0.6s ease-in-out" }} onMouseLeave={() => { setIsActive(false); setTransform("translate3d(0px, 0px, 0px)"); }}>{children}</div>;
        };
        
        const ContactButton = ({ label = "Contact Me", className = "", onClick }) => (
            <button onClick={onClick} className={`contact-gradient font-semibold uppercase tracking-wider rounded-full px-8 py-3 sm:px-10 sm:py-3.5 md:px-12 md:py-4 text-sm sm:text-base md:text-lg transition-all duration-300 ${className}`}>
                {label}
            </button>
        );
        
        const LiveProjectButton = ({ label = "Live Project" }) => (
            <button className="rounded-full border-2 border-[#d4af37] text-[#d4af37] font-semibold uppercase tracking-wider px-6 py-2.5 sm:px-8 sm:py-3 text-xs sm:text-sm hover:bg-[#d4af37]/10 transition-all duration-300 hover:scale-105">
                {label}
            </button>
        );
        
        const Word = ({ children, progress, range }) => { 
            const opacity = useTransform(progress, range, [0.2, 1]); 
            return <span className="inline-block mr-[0.25em]"><motion.span style={{ opacity }} className="inline-block">{children}</motion.span></span>; 
        };
        
        const AnimatedText = ({ text, className = "" }) => {
            const ref = useRef(null); 
            const { scrollYProgress } = useScroll({ target: ref, offset: ["start 0.8", "end 0.2"] }); 
            const words = text.split(" ");
            return <p ref={ref} className={`${className}`} style={{ lineHeight: 1.6 }}>{words.map((word, i) => <Word key={i} progress={scrollYProgress} range={[i / words.length, (i + 1) / words.length]}>{word}</Word>)}</p>;
        };

        const RegistrationForm = ({ isOpen, onClose }) => {
            const [step, setStep] = useState(1);
            const [showPayFast, setShowPayFast] = useState(false);
            const [formData, setFormData] = useState({
                fullName: '', email: '', phone: '', city: '', occupation: '',
                experienceLevel: '', playStyle: '', gameplayMode: [],
                coreValues: [], primaryGoal: '', agreedToTerms: false
            });

            if (!isOpen) return null;

            const updateField = (field, value) => setFormData(prev => ({ ...prev, [field]: value }));
            const toggleArrayField = (field, value) => {
                setFormData(prev => {
                    const arr = prev[field];
                    if (field === 'coreValues' && arr.includes(value) && arr.length >= 2) return prev;
                    return { ...prev, [field]: arr.includes(value) ? arr.filter(v => v !== value) : [...arr, value] };
                });
            };

            const nextStep = () => setStep(s => Math.min(s + 1, 4));
            const prevStep = () => setStep(s => Math.max(s - 1, 1));

            const handleSubmit = (e) => {
                e.preventDefault();
                if (formData.agreedToTerms) setShowPayFast(true);
            };

            const renderStep = () => {
                switch(step) {
                    case 1: return (
                        <div className="space-y-4">
                            <h3 className="text-xl font-bold text-[#d4af37]">Step 1: Cadet Profile</h3>
                            {['fullName', 'email', 'phone', 'city', 'occupation'].map(field => (
                                <div key={field}>
                                    <label className="form-label capitalize">{field.replace(/([A-Z])/g, ' $1').trim()}</label>
                                    <input type={field === 'email' ? 'email' : 'text'} className="form-input" value={formData[field]} onChange={e => updateField(field, e.target.value)} required={field !== 'occupation'} />
                                </div>
                            ))}
                        </div>
                    );
                    case 2: return (
                        <div className="space-y-4">
                            <h3 className="text-xl font-bold text-[#d4af37]">Step 2: Gameplay Profile</h3>
                            <div>
                                <label className="form-label">Experience Level</label>
                                {['Beginner', 'Casual', 'Intermediate', 'Advanced'].map(level => (
                                    <label key={level} className="form-radio-label">
                                        <input type="radio" name="exp" className="accent-[#d4af37]" checked={formData.experienceLevel === level} onChange={() => updateField('experienceLevel', level)} required />
                                        <span>{level}</span>
                                    </label>
                                ))}
                            </div>
                            <div>
                                <label className="form-label">Play Style</label>
                                <select className="form-input" value={formData.playStyle} onChange={e => updateField('playStyle', e.target.value)} required>
                                    <option value="">Select...</option>
                                    {['Aggressive', 'Defensive', 'Balanced', 'Patient / Opportunistic'].map(s => <option key={s} value={s}>{s}</option>)}
                                </select>
                            </div>
                            <div>
                                <label className="form-label">Preferred Mode</label>
                                {['Physical Board', 'Digital / Mobile', 'Both'].map(mode => (
                                    <label key={mode} className="form-check-label">
                                        <input type="checkbox" className="accent-[#d4af37]" checked={formData.gameplayMode.includes(mode)} onChange={() => toggleArrayField('gameplayMode', mode)} />
                                        <span>{mode}</span>
                                    </label>
                                ))}
                            </div>
                        </div>
                    );
                    case 3: return (
                        <div className="space-y-4">
                            <h3 className="text-xl font-bold text-[#d4af37]">Step 3: Mindset & Growth</h3>
                            <div>
                                <label className="form-label">Core Values (Max 2)</label>
                                {['Patience & Timing', 'Focus & Concentration', 'Strategic Decision-Making', 'Resilience Under Setbacks', 'Calculated Risk-Taking'].map(val => (
                                    <label key={val} className="form-check-label">
                                        <input type="checkbox" className="accent-[#d4af37]" checked={formData.coreValues.includes(val)} onChange={() => toggleArrayField('coreValues', val)} disabled={formData.coreValues.length >= 2 && !formData.coreValues.includes(val)} />
                                        <span>{val}</span>
                                    </label>
                                ))}
                            </div>
                            <div>
                                <label className="form-label">Primary Goal</label>
                                <textarea className="form-input" rows="3" value={formData.primaryGoal} onChange={e => updateField('primaryGoal', e.target.value)} required></textarea>
                            </div>
                        </div>
                    );
                    case 4: return (
                        <div className="space-y-4">
                            <h3 className="text-xl font-bold text-[#d4af37]">Step 4: Code of Excellence</h3>
                            <div className="bg-[#0f1535] p-4 rounded border border-[#d4af37]/20 text-sm text-gray-300 max-h-40 overflow-y-auto">
                                <p className="mb-2 font-semibold text-[#d4af37]">Academy Pledge:</p>
                                <p>"Every move matters both on the board and in life. I commit to upholding the values of discipline, sportsmanship, continuous learning, and respect."</p>
                                <p className="mt-2 text-xs text-gray-400">By proceeding, you agree to the full Code of Excellence and Academy Terms.</p>
                            </div>
                            <label className="form-check-label">
                                <input type="checkbox" className="accent-[#d4af37] w-5 h-5 mt-0.5" checked={formData.agreedToTerms} onChange={e => updateField('agreedToTerms', e.target.checked)} required />
                                <span>I agree to the Code of Excellence and Academy Terms.</span>
                            </label>
                        </div>
                    );
                }
            };

            if (showPayFast) {
                return (
                    <div className="form-overlay">
                        <div className="form-container">
                            <div className="form-header">
                                <h2 className="text-xl font-bold text-[#d4af37]">Complete Registration</h2>
                                <button onClick={() => setShowPayFast(false)} className="text-gray-400 hover:text-white text-2xl leading-none">&times;</button>
                            </div>
                            <div className="form-body text-center">
                                <div className="w-16 h-16 bg-green-500/20 text-green-500 rounded-full flex items-center justify-center mx-auto mb-4">
                                    <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg>
                                </div>
                                <h3 className="text-2xl font-bold text-[#d4af37] mb-2">Application Received!</h3>
                                <p className="text-gray-300 mb-6">Proceed to secure payment via PayFast to finalize your cadet registration.</p>
                                <form action="https://sandbox.payfast.co.za/eng/process" method="POST" className="space-y-3">
                                    <input type="hidden" name="merchant_id" value="YOUR_MERCHANT_ID" />
                                    <input type="hidden" name="merchant_key" value="YOUR_MERCHANT_KEY" />
                                    <input type="hidden" name="amount" value="150.00" />
                                    <input type="hidden" name="item_name" value="Ludo Academy Cadet Registration" />
                                    <input type="hidden" name="name_first" value={formData.fullName} />
                                    <input type="hidden" name="email_address" value={formData.email} />
                                    <input type="hidden" name="cell_number" value={formData.phone} />
                                    <input type="hidden" name="return_url" value="https://ludoacademy.ludoleague.co.za/success" />
                                    <input type="hidden" name="cancel_url" value="https://ludoacademy.ludoleague.co.za/cancel" />
                                    <button type="submit" className="w-full bg-[#d4af37] text-[#0a0e27] font-bold py-3 rounded-full hover:bg-[#f4e5c2] transition">Pay R150.00 via PayFast</button>
                                </form>
                                <button onClick={() => setShowPayFast(false)} className="mt-4 text-sm text-gray-400 hover:text-white">Back to Form</button>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="form-overlay">
                    <div className="form-container">
                        <div className="form-header">
                            <div>
                                <h2 className="text-xl font-bold text-[#d4af37]">Cadet Application</h2>
                                <p className="text-xs text-gray-400">Step {step} of 4</p>
                            </div>
                            <button onClick={onClose} className="text-gray-400 hover:text-white text-2xl leading-none">&times;</button>
                        </div>
                        <div className="form-body">
                            <div className="flex justify-center space-x-2 mb-6">
                                {[1, 2, 3, 4].map(i => (
                                    <div key={i} className={`progress-dot ${i <= step ? 'bg-[#d4af37]' : 'bg-gray-700'}`} />
                                ))}
                            </div>
                            <form onSubmit={handleSubmit}>
                                {renderStep()}
                                <div className="flex justify-between mt-8 sticky bottom-0 bg-[#0a0e27] pt-4 border-t border-[#d4af37]/10">
                                    {step > 1 ? (
                                        <button type="button" onClick={prevStep} className="px-6 py-2 border border-[#d4af37] text-[#d4af37] rounded-full hover:bg-[#d4af37]/10 transition">Back</button>
                                    ) : <div />}
                                    {step < 4 ? (
                                        <button type="button" onClick={nextStep} className="px-6 py-2 bg-[#d4af37] text-[#0a0e27] font-bold rounded-full hover:bg-[#f4e5c2] transition">Next</button>
                                    ) : (
                                        <button type="submit" className="px-6 py-2 bg-[#d4af37] text-[#0a0e27] font-bold rounded-full hover:bg-[#f4e5c2] transition">Submit Application</button>
                                    )}
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            );
        };

        const CookieConsent = () => {
            const [visible, setVisible] = useState(true);
            if (!visible) return null;
            return (
                <div className="cookie-banner">
                    <p className="text-sm text-gray-300 mb-3">
                        We use cookies to enhance your experience and comply with the <strong className="text-[#d4af37]">POPI Act</strong>. By continuing, you agree to our <a href="#" className="text-[#d4af37] underline hover:text-[#f4e5c2]">Privacy Policy</a>.
                    </p>
                    <div className="flex space-x-2">
                        <button onClick={() => setVisible(false)} className="flex-1 bg-[#d4af37] text-[#0a0e27] font-bold py-2 rounded-lg text-sm hover:bg-[#f4e5c2] transition">Accept All</button>
                        <button onClick={() => setVisible(false)} className="flex-1 border border-gray-600 text-gray-300 py-2 rounded-lg text-sm hover:bg-gray-800 transition">Decline</button>
                    </div>
                </div>
            );
        };
        
        const HeroSection = ({ openForm }) => (
            <section className="min-h-screen flex flex-col relative overflow-hidden bg-gradient-to-b from-[#0a0e27] via-[#0f1535] to-[#0a0e27]">
                <FadeIn delay={0} y={-20}>
                    <nav className="flex justify-between items-center px-6 md:px-10 pt-6 md:pt-8 nav-text font-medium uppercase tracking-wider text-xs sm:text-sm md:text-base">
                        <a href="#about" className="hover:opacity-70 transition-opacity">About</a>
                        <a href="#training" className="hover:opacity-70 transition-opacity">Training</a>
                        <a href="#success" className="hover:opacity-70 transition-opacity">Success</a>
                        <a href="#contact" className="hover:opacity-70 transition-opacity">Contact</a>
                    </nav>
                </FadeIn>
                <div className="flex-1 flex flex-col items-center justify-center px-4 sm:px-6 md:px-10 py-12">
                    <FadeIn delay={0.15} y={20} className="w-full text-center mb-6 sm:mb-8">
                        <h1 className="hero-heading font-black uppercase tracking-tight leading-none whitespace-nowrap w-full text-[10vw] sm:text-[8vw] md:text-[7vw] lg:text-[6vw]">Ludo Academy of Excellence</h1>
                    </FadeIn>
                    <FadeIn delay={0.3} y={20} className="mb-8 sm:mb-10">
                        <p className="text-[#d4af37] font-light uppercase tracking-wide leading-snug max-w-md mx-auto text-center text-sm sm:text-base md:text-lg opacity-90">Where every move matters. Strategy, discipline, and excellence.</p>
                    </FadeIn>
                    <FadeIn delay={0.45} y={20} className="mb-10 sm:mb-12">
                        <ContactButton label="Join Us" onClick={openForm} />
                    </FadeIn>
                    <FadeIn delay={0.6} y={30} className="w-full max-w-4xl mx-auto">
                        <Magnet padding={150} strength={3}>
                            <div className="relative rounded-2xl sm:rounded-3xl overflow-hidden shadow-2xl border-4 border-[#d4af37]/30">
                                <img src="https://res.cloudinary.com/dfzeb1s54/image/upload/v1784647925/Ludo_officials_after_training_for_their_respective_leagues_in_Alex_Soweto_and_Mamelodi._2022_tqwkjs.jpg" alt="Ludo Academy Training Session" className="w-full h-auto object-cover" loading="lazy" />
                                <div className="absolute inset-0 bg-gradient-to-t from-[#0a0e27]/60 to-transparent"></div>
                            </div>
                        </Magnet>
                    </FadeIn>
                </div>
            </section>
        );
        
        const MarqueeSection = () => {
            const sectionRef = useRef(null); 
            const [offset, setOffset] = useState(0);
            const row1Images = [
                "https://res.cloudinary.com/dfzeb1s54/image/upload/v1784647925/Ludo_Academy_of_excellence_learning_vihidj.jpg",
                "https://res.cloudinary.com/dfzeb1s54/image/upload/v1783142171/LudoLeagueSA_vwtysc.png",
                "https://res.cloudinary.com/dfzeb1s54/image/upload/v1779664335/Soweto_Ludo_League_Tournament_rnkewh.jpg",
                "https://res.cloudinary.com/dfzeb1s54/image/upload/v1779563470/INTER-TOWNSHIP-KNOCKOUT_Battle_of_the_Kasis.The_ultimate_inter_township_clash.The_three_titans_of_the_Ludo_League_South_Africa_rmnqm4.jpg",
                "https://res.cloudinary.com/dfzeb1s54/image/upload/v1784649728/Ludo_Academy_of_Excellence_2K_202607211756_1_b1jvqu.jpg"
            ];
            const tripled1 = [...row1Images, ...row1Images, ...row1Images];
            useEffect(() => { 
                const handleScroll = () => { if (sectionRef.current) setOffset((window.scrollY - sectionRef.current.offsetTop + window.innerHeight) * 0.3); }; 
                window.addEventListener("scroll", handleScroll, { passive: true }); 
                return () => window.removeEventListener("scroll", handleScroll); 
            }, []);
            return (
                <section ref={sectionRef} className="bg-[#0a0e27] pt-16 sm:pt-20 md:pt-24 pb-8 overflow-hidden">
                    <div className="flex flex-col gap-3">
                        <div className="marquee-row flex gap-3" style={{ transform: `translateX(${offset - 200}px)` }}>
                            {tripled1.map((src, i) => (
                                <img key={i} src={src} alt="" className="w-[200px] h-[130px] sm:w-[280px] sm:h-[180px] md:w-[360px] md:h-[230px] rounded-xl sm:rounded-2xl object-cover flex-shrink-0 border-2 border-[#d4af37]/20" loading="lazy" />
                            ))}
                        </div>
                    </div>
                </section>
            );
        };
        
        const AboutSection = ({ openForm }) => (
            <section id="about" className="min-h-screen flex flex-col items-center justify-center px-5 sm:px-8 md:px-10 py-20 relative bg-gradient-to-b from-[#0a0e27] to-[#0f1535]">
                <FadeIn delay={0.1} x={-80} className="absolute top-[10%] left-[2%] hidden sm:block">
                    <img src="https://res.cloudinary.com/dfzeb1s54/image/upload/v1784647932/Ludo_Academy_of_excellence_Logo_ky20i3.jpg" alt="Strategy" className="w-[120px] md:w-[160px] rounded-2xl opacity-60 border-2 border-[#d4af37]/30" />
                </FadeIn>
                <FadeIn delay={0} y={40} className="mb-8 sm:mb-10 md:mb-12">
