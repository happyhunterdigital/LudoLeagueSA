<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Academy of Excellence</title>
    <link rel="icon" href="https://res.cloudinary.com/dfzeb1s54/image/upload/v1784647932/Ludo_Academy_of_excellence_Logo_ky20i3.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body, #root { background: #0a0e27; font-family: 'Kanit', sans-serif; overflow-x: hidden; }
        .hero-heading { background: linear-gradient(135deg, #d4af37 0%, #f4e5c2 50%, #1e3a8a 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .contact-gradient { background: linear-gradient(135deg, #1e3a8a, #3b82f6); border: 2px solid #d4af37; color: #d4af37; }
        .contact-gradient:hover { transform: scale(1.05); box-shadow: 0 0 15px rgba(59, 130, 246, 0.5); }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel" src="components.js" data-presets="react"></script>
    <script type="text/babel" src="sections.js" data-presets="react"></script>
    <script type="text/babel" src="RegistrationForm.js" data-presets="react"></script>
    <script type="text/babel" src="app.js" data-presets="react"></script>
</body>
</html>
